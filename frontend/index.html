<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Livros</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --texto: #1f2430; --suave: #6b7080;
    --borda: #e3dfd5; --destaque: #2f5d50; --destaque-texto: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #20242c; --texto: #eceae4; --suave: #9aa0ae;
      --borda: #2f3441; --destaque: #6fb59f; --destaque-texto: #10231d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  header { max-width: 980px; margin: 0 auto; padding: 32px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 1.9rem; }
  header p { margin: 0; color: var(--suave); }
  .controles {
    max-width: 980px; margin: 0 auto; padding: 16px 20px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--suave); }
  select, input {
    font: inherit; color: var(--texto); background: var(--card);
    border: 1px solid var(--borda); border-radius: 8px; padding: 9px 12px; min-width: 220px;
  }
  select:focus, input:focus { outline: 2px solid var(--destaque); outline-offset: 1px; }
  #contagem { margin-left: auto; color: var(--suave); font-size: .9rem; padding-bottom: 10px; }
  main {
    max-width: 980px; margin: 0 auto; padding: 4px 20px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
  }
  .livro {
    background: var(--card); border: 1px solid var(--borda); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  }
  .livro h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .preco {
    align-self: flex-start; background: var(--destaque); color: var(--destaque-texto);
    padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: .95rem;
  }
  .vazio { grid-column: 1 / -1; text-align: center; color: var(--suave); padding: 40px 0; }
  .erro { max-width: 980px; margin: 24px auto; padding: 16px 20px; border: 1px solid #c0392b; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1>Catálogo de Livros</h1>
  <p>Litetura:</p>
</header>

<div class="controles">
  <label>Ordenar por
    <select id="ordem">
      <option value="precoCrescente">Preço: menor para maior</option>
      <option value="precoDecrescente">Preço: maior para menor</option>
      <option value="nomeCrescente">Nome: A a Z</option>
      <option value="nomeDecrescente">Nome: Z a A</option>
    </select>
  </label>
  <label>Buscar por nome
    <input id="busca" type="search" placeholder="Ex.: Harry">
  </label>
  <span id="contagem"></span>
</div>

<main id="lista"></main>

<!-- dados.js é gerado pelo programa em C: ./main --web -->
<script src="dados.js"></script>
<script>
  const ordem = document.getElementById("ordem");
  const busca = document.getElementById("busca");
  const lista = document.getElementById("lista");
  const contagem = document.getElementById("contagem");
  const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

  function desenha() {
    const termo = busca.value.trim().toLowerCase();
    const livros = CATALOGO[ordem.value].filter(l => l.nome.toLowerCase().includes(termo));

    lista.replaceChildren();
    contagem.textContent = livros.length + (livros.length === 1 ? " livro" : " livros");

    if (livros.length === 0) {
      const vazio = document.createElement("p");
      vazio.className = "vazio";
      vazio.textContent = "Nenhum livro encontrado.";
      lista.appendChild(vazio);
      return;
    }

    for (const l of livros) {
      const card = document.createElement("article");
      card.className = "livro";
      const titulo = document.createElement("h2");
      titulo.textContent = l.nome;
      const preco = document.createElement("span");
      preco.className = "preco";
      preco.textContent = moeda.format(l.preco);
      card.append(titulo, preco);
      lista.appendChild(card);
    }
  }

  if (typeof CATALOGO === "undefined") {
    document.querySelector(".controles").remove();
    const erro = document.createElement("div");
    erro.className = "erro";
    erro.textContent = "Não achei o dados.js. Rode o programa em C com ./main --web para gerá-lo.";
    document.body.appendChild(erro);
  } else {
    ordem.addEventListener("change", desenha);
    busca.addEventListener("input", desenha);
    desenha();
  }
</script>
</body>
</html>
